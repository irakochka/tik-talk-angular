<label class="auth-input-control" [class.input-control--with-icon]="!!icon()">
  <span class="auth-input-control__label">{{ labelText() }}</span>

  <span class="auth-input-control__field">
    <input
      class="input-control__input"
      [type]="type()"
      [placeholder]="placeholder()"
      [ngModel]="value"
      (ngModelChange)="onInput($event)"
      (blur)="onTouched()"
    />

    <span class="auth-input-control__icon">
      <ng-content select="[icon]" />
    </span>
  </span>
</label>
